<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURU — Register</title>
<link rel="stylesheet" href="system.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <div class="navbar-brand">AURU</div>
    <div class="navbar-links">
      <a href="login.html">Log in</a>
      <a href="register.html">Register</a>
      <a href="verify.html">Verify Document</a>
    </div>
    <div class="navbar-user">Preview Mode</div>
  </div>
</nav>

<div class="container stack">
  <div class="card">
    <h2>AURU — Register</h2>
    <form id="regForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input class="form-input" id="full_name" type="text" placeholder="Rahim Uddin" required minlength="2" maxlength="100">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" placeholder="name@university.edu" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="student_id">Student ID</label>
        <input class="form-input" id="student_id" type="text" placeholder="2025-101">
        <p class="form-text">Optional. Used for official document matching.</p>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••" required minlength="8">
        <p class="form-text">Min 8 characters, at least one uppercase letter and one number.</p>
      </div>
      <button class="btn" type="submit">Create Account</button>
    </form>
    <p class="small">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script>
document.getElementById('regForm').addEventListener('submit', function(e){
  e.preventDefault();
  const pw = document.getElementById('password').value;
  const hasUpper = /[A-Z]/.test(pw);
  const hasNum = /[0-9]/.test(pw);
  if (pw.length < 8 || !hasUpper || !hasNum) {
    alert('Password must be 8+ characters with at least one uppercase letter and one number.');
    return;
  }
  alert('Account created. You can now log in.');
  window.location.href = 'login.html';
});
</script>
</body>
</html>
