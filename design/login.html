<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURU — Login</title>
<link rel="stylesheet" href="system.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <div class="navbar-brand">AURU</div>
    <div class="navbar-links">
      <a href="login.html">Log in</a>
      <a href="register.html">Register</a>
      <a href="verify.html">Verify Document</a>
    </div>
    <div class="navbar-user">Preview Mode</div>
  </div>
</nav>

<div class="container stack">
  <div class="card">
    <h2>AURU — Log in</h2>
    <div class="alert alert--error" id="error" style="display:none;">Invalid email or password.</div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" placeholder="name@university.edu" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••" required>
      </div>
      <button class="btn" type="submit">Log in</button>
    </form>
    <p class="small">New user? <a href="register.html">Create an account</a></p>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const err = document.getElementById('error');
  err.style.display = 'block';
  setTimeout(()=> err.style.display = 'none', 2500);
});
</script>
</body>
</html>
